# Configuración local de SIMPLE.
# Las credenciales deben definirse como variables de entorno en IntelliJ IDEA.
# La URL conserva la base simple_db y no ejecuta cambios de esquema ni elimina datos.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/simple_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=8080
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
